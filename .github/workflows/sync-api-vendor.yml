name: Sync portaleargo-api vendor

on:
  push:
    branches:
      - fix/sync-bulletin-confirmation

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MCP
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'

      - name: Build canonical API
        run: |
          git clone --depth 1 --branch main https://github.com/DanielVd/portaleargo-api.git /tmp/portaleargo-api
          cd /tmp/portaleargo-api
          npm ci --legacy-peer-deps --ignore-scripts
          npm run build

      - name: Sync generated dist
        run: |
          rm -rf vendor/portaleargo-api/dist
          cp -a /tmp/portaleargo-api/dist vendor/portaleargo-api/dist

      - name: Commit generated vendor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/portaleargo-api/dist
          if git diff --cached --quiet; then
            echo "Vendor already up to date"
            exit 0
          fi
          git commit -m "chore: sync portaleargo-api vendor"
          git push origin HEAD:fix/sync-bulletin-confirmation
