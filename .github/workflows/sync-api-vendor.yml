name: Sync API vendor

on:
  push:
    branches:
      - feat/famiglia-api

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MCP
        uses: actions/checkout@v4
        with:
          ref: feat/famiglia-api
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Checkout canonical API
        run: git clone --depth 1 --branch feat/modern-api https://github.com/DanielVd/portaleargo-api.git /tmp/portaleargo-api

      - name: Build canonical API
        working-directory: /tmp/portaleargo-api
        run: |
          npm ci --legacy-peer-deps --ignore-scripts
          npm run build

      - name: Sync generated dist
        run: |
          rm -rf vendor/portaleargo-api/dist
          cp -a /tmp/portaleargo-api/dist vendor/portaleargo-api/dist

      - name: Commit vendor update
        run: |
          if git diff --quiet -- vendor/portaleargo-api/dist; then
            echo "Vendor already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/portaleargo-api/dist
          git commit -m "chore: sync Famiglia API vendor"
          git push origin HEAD:feat/famiglia-api
