name: CI

on:
  push:
    branches:
      - main
      - feat/famiglia-api
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Mutation E2E syntax
        run: node --check scripts/e2e-mcp-mutations.mjs

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
