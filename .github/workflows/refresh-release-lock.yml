name: Sync release API vendor

on:
  push:
    branches:
      - release/0.2.0

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MCP
        uses: actions/checkout@v4
        with:
          ref: release/0.2.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: npm

      - name: Build canonical API
        run: |
          git clone --depth 1 --branch main https://github.com/DanielVd/portaleargo-api.git /tmp/portaleargo-api
          cd /tmp/portaleargo-api
          test "$(node -p "require('./package.json').version")" = "1.1.0"
          npm ci --legacy-peer-deps --ignore-scripts
          npm run build

      - name: Sync generated API dist
        run: |
          rm -rf vendor/portaleargo-api/dist
          cp -a /tmp/portaleargo-api/dist vendor/portaleargo-api/dist

      - name: Refresh MCP lockfile
        run: npm update --package-lock-only --ignore-scripts

      - name: Commit synchronized vendor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/portaleargo-api/dist package-lock.json
          if git diff --cached --quiet; then
            echo "Vendor and lockfile already up to date"
            exit 0
          fi
          git commit -m "chore: sync portaleargo-api 1.1.0 vendor"
          git push origin HEAD:release/0.2.0
